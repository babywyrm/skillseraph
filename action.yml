name: "skillseraph"
description: "Scan agent config files (skills, rules, hooks, instructions) for poisoning and injection."
author: "babywyrm"
branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "Directory to scan."
    required: false
    default: "."
  fail-on:
    description: "Severity threshold that fails the run (critical|high|medium|low|any|none)."
    required: false
    default: "high"
  platform:
    description: "Restrict to a specific platform (cursor, codex, claude, …). Empty = auto-detect."
    required: false
    default: ""
  include-deps:
    description: "Scan dependency trees (node_modules, vendor, .venv)."
    required: false
    default: "true"
  changed-only:
    description: "Only scan files changed in the PR (fast gate). Ignored on push events."
    required: false
    default: "true"
  baseline:
    description: "Path to a baseline file (suppress known/accepted findings)."
    required: false
    default: ""
  baseline-max-age:
    description: "Fail (exit 2) if the baseline is older than this many days. Empty = no limit."
    required: false
    default: ""
  min-confidence:
    description: "Drop findings below this confidence (low|medium|high)."
    required: false
    default: "low"
  sarif:
    description: "Path to write SARIF 2.1.0 output."
    required: false
    default: "skillseraph.sarif"
  json:
    description: "Path to write JSON findings."
    required: false
    default: "skillseraph.json"

outputs:
  sarif-file:
    description: "Path to the generated SARIF file."
    value: ${{ inputs.sarif }}
  json-file:
    description: "Path to the generated JSON file."
    value: ${{ inputs.json }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Install skillseraph
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: uv tool install "$ACTION_PATH"

    - name: Compute changed files (PR diff mode)
      id: diff
      if: inputs.changed-only == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/skillseraph-changed.txt"
        echo "files=$RUNNER_TEMP/skillseraph-changed.txt" >> "$GITHUB_OUTPUT"

    - name: Run skillseraph
      shell: bash
      env:
        IN_PATH: ${{ inputs.path }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_SARIF: ${{ inputs.sarif }}
        IN_JSON: ${{ inputs.json }}
        IN_PLATFORM: ${{ inputs.platform }}
        IN_INCLUDE_DEPS: ${{ inputs.include-deps }}
        IN_BASELINE: ${{ inputs.baseline }}
        IN_BASELINE_MAX_AGE: ${{ inputs.baseline-max-age }}
        IN_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        IN_FILES_FROM: ${{ steps.diff.outputs.files }}
      run: |
        ARGS=("$IN_PATH" "--fail-on" "$IN_FAIL_ON" "--min-confidence" "$IN_MIN_CONFIDENCE")
        ARGS+=("--sarif" "$IN_SARIF" "--json-out" "$IN_JSON")
        if [ -n "$IN_PLATFORM" ]; then
          ARGS+=("--platform" "$IN_PLATFORM")
        fi
        if [ "$IN_INCLUDE_DEPS" = "false" ]; then
          ARGS+=("--no-deps")
        fi
        if [ -n "$IN_BASELINE" ]; then
          ARGS+=("--baseline" "$IN_BASELINE")
        fi
        if [ -n "$IN_BASELINE_MAX_AGE" ]; then
          ARGS+=("--baseline-max-age" "$IN_BASELINE_MAX_AGE")
        fi
        if [ -n "$IN_FILES_FROM" ]; then
          ARGS+=("--files-from" "$IN_FILES_FROM")
        fi
        skillseraph "${ARGS[@]}"

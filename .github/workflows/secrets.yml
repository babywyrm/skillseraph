name: secrets

# TruffleHog over new commits on every push and PR, and the full history
# weekly. It covers what GitHub secret scanning does not offer on this plan:
# generic patterns (private keys, connection strings) and live verification
# of found credentials. Fails on verified secrets and on ones it could not
# verify.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # ponytail: Dependabot does not bump images in workflow run steps;
          # update this pin by hand when a TruffleHog release is a week old.
          IMAGE: ghcr.io/trufflesecurity/trufflehog:3.99.8@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a
        run: |
          args=(git file:///repo --fail --no-update --github-actions --results=verified,unknown)
          if [ "$EVENT" = pull_request ] || { [ "$EVENT" = push ] && [ -n "${BASE//0/}" ]; }; then
            args+=(--since-commit "$BASE")
          fi
          docker run --rm -v "$PWD:/repo:ro" "$IMAGE" "${args[@]}"

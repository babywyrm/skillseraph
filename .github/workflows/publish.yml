name: publish

# Publishes skillseraph to PyPI when a version tag is pushed.
#
# Setup (one-time):
#   1. Go to https://pypi.org/manage/account/publishing/
#   2. Add a trusted publisher: owner=babywyrm, repo=skillseraph,
#      workflow=publish.yml, environment=pypi
#   3. Create a GitHub environment named "pypi" in repo Settings → Environments.
#      (No secrets needed — uses OIDC trusted publishing.)
#
# Then cut a release (version must match pyproject.toml):
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# The tag's commit must be on main. After PyPI accepts the upload, the
# "release" job creates a GitHub Release with auto-generated notes and moves
# the floating major tag for action consumers. For 0.x that tag is v0
# (uses: babywyrm/skillseraph@v0). It moves only forward, and never for a
# prerelease tag.

on:
  push:
    tags:
      - "v[0-9]*"

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # ── build sdist + wheel ───────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false # release artifacts are built from a clean environment

      - name: Check the tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)"
          case "$STATUS" in
            ahead|identical) ;;
            *) echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1 ;;
          esac

      - name: Check tag matches pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(uv version --short)"
          [ "$TAG" = "v$VERSION" ] || { echo "tag $TAG != v$VERSION"; exit 1; }

      - name: Build
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # ── publish to PyPI ───────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC trusted publishing to PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/skillseraph/
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # ── signed build provenance for the sdist and wheel ───────────────────────
  attest:
    name: Attest distribution
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  # ── GitHub Release + floating major tag ───────────────────────────────────
  release:
    name: GitHub Release
    needs: [build, publish-pypi, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub release + update floating tag
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

      - name: Update floating major tag (e.g. v0)
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$GITHUB_REF_NAME is a prerelease; leaving the floating tag alone"
            exit 0
          fi
          # Extract major version from the pushed tag (v0.3.0 → v0)
          MAJOR="${GITHUB_REF_NAME%%.*}"
          REFS="repos/$GITHUB_REPOSITORY/git/refs"
          if CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$MAJOR" --jq .sha 2>/dev/null)"; then
            STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$CURRENT...$GITHUB_SHA" --jq .status)"
            case "$STATUS" in
              ahead) gh api -X PATCH "$REFS/tags/$MAJOR" -f sha="$GITHUB_SHA" -F force=true ;;
              identical) ;;
              *) echo "::warning::$MAJOR is not behind $GITHUB_REF_NAME; not moving it" ;;
            esac
          else
            gh api "$REFS" -f ref="refs/tags/$MAJOR" -f sha="$GITHUB_SHA"
          fi

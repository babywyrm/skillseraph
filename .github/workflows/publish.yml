name: publish

# Publishes skillseraph to PyPI when a version tag is pushed.
#
# Setup (one-time):
#   1. Go to https://pypi.org/manage/account/publishing/
#   2. Add a trusted publisher: owner=babywyrm, repo=skillseraph,
#      workflow=publish.yml, environment=pypi
#   3. Create a GitHub environment named "pypi" in repo Settings → Environments.
#      (No secrets needed — uses OIDC trusted publishing.)
#
# Then cut a release (version must match pyproject.toml):
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# The "release" job also creates a GitHub Release with auto-generated notes
# and moves the floating major tag for action consumers. For 0.x that tag is
# v0 (uses: babywyrm/skillseraph@v0).

on:
  push:
    tags:
      - "v[0-9]*"

permissions: {}

jobs:
  # ── build sdist + wheel ───────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check tag matches pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(uv version --short)"
          [ "$TAG" = "v$VERSION" ] || { echo "tag $TAG != v$VERSION"; exit 1; }

      - name: Build
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # ── publish to PyPI ───────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC trusted publishing to PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/skillseraph/
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # ── GitHub Release + floating major tag ───────────────────────────────────
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub release + update floating tag
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

      - name: Update floating major tag (e.g. v0)
        shell: bash
        run: |
          # Extract major version from the pushed tag (v0.3.0 → v0)
          MAJOR="${GITHUB_REF_NAME%%.*}"
          REFS="repos/$GITHUB_REPOSITORY/git/refs"
          if gh api "$REFS/tags/$MAJOR" >/dev/null 2>&1; then
            gh api -X PATCH "$REFS/tags/$MAJOR" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api "$REFS" -f ref="refs/tags/$MAJOR" -f sha="$GITHUB_SHA"
          fi

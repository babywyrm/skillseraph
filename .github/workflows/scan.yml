name: skillseraph scan

# Reusable workflow. Call from any repo:
#
#   jobs:
#     skillseraph:
#       uses: babywyrm/skillseraph/.github/workflows/scan.yml@v0
#       with:
#         fail-on: high

on:
  workflow_call:
    inputs:
      paths:
        description: "Directory to scan."
        required: false
        type: string
        default: "."
      fail-on:
        description: "Severity threshold that fails the run."
        required: false
        type: string
        default: "high"
      include-deps:
        description: "Scan dependency trees."
        required: false
        type: boolean
        default: true
      changed-only:
        description: "Only scan files changed in the PR."
        required: false
        type: boolean
        default: true
      baseline:
        description: "Path to a baseline file (suppress accepted findings)."
        required: false
        type: string
        default: ""
      baseline-max-age:
        description: "Fail if the baseline is older than this many days. Empty = no limit."
        required: false
        type: string
        default: ""
      min-confidence:
        description: "Drop findings below this confidence (low|medium|high)."
        required: false
        type: string
        default: "low"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: skillseraph
        id: scan
        uses: babywyrm/skillseraph@v0 # zizmor: ignore[unpinned-uses] -- moves with this workflow's own v0 tag
        with:
          path: ${{ inputs.paths }}
          fail-on: ${{ inputs.fail-on }}
          include-deps: ${{ inputs.include-deps }}
          changed-only: ${{ inputs.changed-only }}
          baseline: ${{ inputs.baseline }}
          baseline-max-age: ${{ inputs.baseline-max-age }}
          min-confidence: ${{ inputs.min-confidence }}

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: skillseraph.sarif

      - name: Upload JSON artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skillseraph-findings
          path: skillseraph.json

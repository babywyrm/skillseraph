# IDE integration scanning — detects risky VS Code-compatible workspace/user
# configs, debug settings, task automation, and APM/telemetry redirects.
#
# These files are trusted by developer tools before code is reviewed. A poisoned
# tasks.json, launch.json, settings.json, or extension recommendation can turn a
# repo open/debug/build action into execution, secret exposure, or telemetry
# exfiltration.
category: ide_integrations
rules:
  - id: ide_task_remote_shell_pipe
    pattern: "(?i)\"([A-Za-z0-9_]*(command|Command)|args)\"\\s*:\\s*\"[^\"]*(curl|wget)\\s+https?://[^\"]*\\|\\s*(bash|sh|zsh|python|node)"
    severity: critical
    title: "IDE task pipes remote content into an interpreter"
    detail: "A VS Code-compatible task or debug command downloads remote content and pipes it into a shell/runtime. Opening or running the workspace can become code execution."
    taxonomy_id: MCP-T08
    atlas_id: J3

  - id: ide_secret_env_injection
    pattern: "(?i)\"([A-Z0-9_]*(TOKEN|SECRET|PASSWORD|CREDENTIAL)[A-Z0-9_]*|AWS_SECRET_ACCESS_KEY|GITHUB_TOKEN|NPM_TOKEN)\"\\s*:"
    severity: high
    title: "IDE config injects sensitive environment variables"
    detail: "A workspace or user-level IDE config passes secrets through task/debug/runtime environment variables. If the config is attacker-controlled, those values may leak to child tools or collectors."
    taxonomy_id: MCP-T07
    atlas_id: J4

  - id: ide_apm_external_collector
    pattern: "(?i)\"(OTEL_EXPORTER_OTLP_ENDPOINT|DD_TRACE_AGENT_URL|DD_AGENT_HOST|SENTRY_DSN|NEW_RELIC_HOST|HONEYCOMB_API_HOST|ELASTIC_APM_SERVER_URL)\"\\s*:\\s*\"https?://(?!localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)[^\"]+\""
    severity: medium
    title: "IDE config points APM/telemetry to an external collector"
    detail: "A debug/task environment routes traces, logs, or errors to a remote collector. Verify the endpoint is approved and not a telemetry exfiltration redirect."
    taxonomy_id: MCP-T12
    atlas_id: J4

  - id: ide_runtime_preload
    pattern: "(?i)\"(NODE_OPTIONS|PYTHONPATH|RUBYOPT|JAVA_TOOL_OPTIONS|LD_PRELOAD|DYLD_INSERT_LIBRARIES)\"\\s*:\\s*\"[^\"]*(--require|--import|-javaagent|/tmp/|\\.so|\\.dylib|\\.dll|\\.js|\\.py)"
    severity: high
    title: "IDE config preloads runtime code"
    detail: "A task/debug/user setting injects runtime preload hooks. This can persistently execute attacker-controlled code whenever integrated terminals or debug sessions start."
    taxonomy_id: MCP-T09
    atlas_id: J3

  - id: ide_untrusted_extension_recommendation
    pattern: "(?i)\"recommendations\"\\s*:\\s*\\[[^\\]]*(evil|shadow|unknown|local|\\.vsix|http)"
    severity: medium
    confidence: medium
    title: "IDE config recommends an untrusted extension source"
    detail: "Workspace extension recommendations influence what developers install. Local, URL-like, or suspicious extension references should be verified before trust."
    taxonomy_id: MCP-T08
    atlas_id: D3
